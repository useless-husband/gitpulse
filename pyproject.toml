[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "0.1.0"
description = "Turn any git repo's history into a single-file HTML analysis report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "useless-husband" }]
keywords = ["git", "report", "statistics", "visualization", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
gitpulse = "gitpulse.cli:main"

[tool.setuptools]
packages = ["gitpulse"]
